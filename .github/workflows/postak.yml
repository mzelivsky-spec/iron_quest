name: Pošťák (oznámení)
# Pošťák běží ve smyčce skoro 6 hodin a každou minutu zkontroluje frontu.
# Před koncem spustí sám sebe znovu. Plán (cron) je jen záloha, kdyby se řetěz přerušil.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: postak
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: postak
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node send.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          LOOP_MIN: "340"
      - name: Spustit další kolo
        if: success()
        run: gh workflow run postak.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
